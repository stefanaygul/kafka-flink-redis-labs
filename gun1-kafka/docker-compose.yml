# Gün 1 · 3 broker'lı Kafka cluster (KRaft) + Kafka UI
#
#   make up      başlat ve hazır olana kadar bekle
#   make down    durdur (veri kalır)
#   make clean   durdur ve bütün veriyi sil
#
# Her node hem broker hem controller (KRaft "combined" mod). Eğitim için yeterli;
# production'da controller'lar ayrı node'larda çalışır.
#
#   Bilgisayarınızdan (Python):  localhost:9092, localhost:9093, localhost:9094
#   Docker ağı içinden:          kafka-1:29092, kafka-2:29092, kafka-3:29092

name: kafka-lab-gun1

x-kafka-env: &kafka-env
  CLUSTER_ID: "n3SGX55xR2auUTU_-S26BA"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # Dayanıklılık: her kayıt 3 broker'da tutulur; acks=all yazımda en az 2 kopya şart.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Topic'ler yalnızca kafka-init ile oluşturulur; yazım hatası yeni topic açmasın.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

x-kafka: &kafka
  image: apache/kafka:4.3.1
  # Docker yeniden başlayınca broker'lar da geri gelir. "make broker-stop" ile
  # bilerek durdurulan broker ise durdurulmuş kalır.
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 15s

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports: ["${KAFKA_1_PORT:-9092}:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:${KAFKA_1_PORT:-9092}
    volumes: [kafka-1-data:/var/lib/kafka/data]

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports: ["${KAFKA_2_PORT:-9093}:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:${KAFKA_2_PORT:-9093}
    volumes: [kafka-2-data:/var/lib/kafka/data]

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports: ["${KAFKA_3_PORT:-9094}:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:${KAFKA_3_PORT:-9094}
    volumes: [kafka-3-data:/var/lib/kafka/data]

  # Topic'leri oluşturur ve çıkar. Tekrar çalıştırmak güvenlidir.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092,kafka-2:29092,kafka-3:29092 \
            --create --if-not-exists --replication-factor 3 "$$@" > /dev/null
        }
        # İşlemler. Key = customerId. min.insync.replicas=2: acks=all yazım en az 2 kopya ister.
        create --topic bank.transactions --partitions 6 --config min.insync.replicas=2
        # Görev 4: küçük segment boyutu (1 MB), segment değişimini birkaç saniyede görmek için.
        create --topic lab.segments --partitions 1 --config segment.bytes=1048576
        echo "Topic'ler hazır: bank.transactions (6 partition, RF=3), lab.segments"
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    depends_on:
      kafka-1: { condition: service_healthy }
    ports: ["${KAFKA_UI_PORT:-8080}:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: gun1
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: "-Xms128m -Xmx384m"

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
