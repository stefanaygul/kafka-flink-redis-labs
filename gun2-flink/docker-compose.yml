# Gün 2 · Kafka (tek broker) + Flink 1.20 + Kafka UI
#
#   make up      başlat (ilk seferde Flink imajı derlenir) ve hazır olana kadar bekle
#   make down    durdur (veri kalır)
#   make clean   durdur ve bütün veriyi sil
#
# Gün 1'den farklı olarak tek broker: bugünün konusu Flink, bellek Flink'e kalsın.
#   Bilgisayarınızdan: Kafka localhost:9092 · Flink UI http://localhost:8081
#   Docker ağı içinden (Flink): kafka:29092

name: kafka-lab-gun2

x-flink: &flink
  image: kafka-lab-flink:1.20.5-kafka-3.4.0
  # İmaj Docker Hub'da yok: burada derlenir (ilk seferde ~1 dk). İki servis de aynı imajı kullanır.
  build: ./flink
  pull_policy: build
  restart: unless-stopped
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      rest.address: jobmanager
      jobmanager.memory.process.size: 1280m
      taskmanager.memory.process.size: 2560m
      taskmanager.memory.managed.fraction: 0.1
      taskmanager.numberOfTaskSlots: 8
      parallelism.default: 2
      heartbeat.timeout: 20000
      # Her 10 sn'de bir checkpoint: TaskManager çökerse job buradan devam eder (Görev 7).
      execution.checkpointing.interval: 10s
      execution.checkpointing.mode: EXACTLY_ONCE
      execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
      state.backend.type: hashmap
      state.checkpoints.dir: file:///flink-data/checkpoints
      state.savepoints.dir: file:///flink-data/savepoints
      state.checkpoints.num-retained: 3
      restart-strategy.type: fixed-delay
      restart-strategy.fixed-delay.attempts: 2147483647
      restart-strategy.fixed-delay.delay: 5s
      table.local-time-zone: UTC
  volumes:
    - flink-data:/flink-data

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    restart: unless-stopped
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      CLUSTER_ID: "J3EBRmRTQl2USLGZFn6SUw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_CLEANER_BACKOFF_MS: 15000
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Topic'leri oluşturur, müşteri profillerini yükler ve çıkar. Tekrar çalıştırmak güvenlidir.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BS=kafka:29092
        create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists --replication-factor 1 "$$@" > /dev/null; }
        create --topic bank.transactions --partitions 6
        create --topic lab.scenario-transactions --partitions 1
        # Temporal join için müşteri risk kategorileri: key = customerId, compacted.
        create --topic bank.customer-profiles --partitions 1 --config cleanup.policy=compact
        # Flink'in ürettiği feature'lar: key = customerId, compacted (her müşterinin son penceresi kalır).
        create --topic bank.customer-features --partitions 6 --config cleanup.policy=compact \
          --config segment.ms=300000 --config min.cleanable.dirty.ratio=0.1
        count=$$(/opt/kafka/bin/kafka-get-offsets.sh --bootstrap-server $$BS --topic bank.customer-profiles | awk -F: '{s+=$$3} END {print s+0}')
        if [ "$$count" -eq 0 ]; then
          # 500 müşteri profili, geçerlilik başlangıcı 2026-01-01. C-1007, C-1042, C-1113 HIGH; her 10. müşteri MEDIUM.
          for i in $$(seq 1001 1500); do
            cat=LOW; [ $$((i % 10)) -eq 0 ] && cat=MEDIUM
            case $$i in 1007|1042|1113) cat=HIGH ;; esac
            echo "C-$$i|{\"customerId\":\"C-$$i\",\"riskCategory\":\"$$cat\",\"segment\":\"RETAIL\",\"updatedAt\":1767225600000}"
          done | /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server $$BS --topic bank.customer-profiles \
                   --reader-property parse.key=true --reader-property key.separator='|'
        fi
        echo "Topic'ler ve 500 müşteri profili hazır."
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["${KAFKA_UI_PORT:-8080}:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: gun2
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: "-Xms128m -Xmx384m"

  jobmanager:
    <<: *flink
    hostname: jobmanager
    command: jobmanager
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["${FLINK_UI_PORT:-8081}:8081"]
    volumes:
      - flink-data:/flink-data
      # SQL dosyaları: sql-client bunları buradan okur (make sql, make submit).
      - ./sql:/opt/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  taskmanager:
    <<: *flink
    hostname: taskmanager
    command: taskmanager
    depends_on:
      jobmanager: { condition: service_healthy }

volumes:
  kafka-data:
  flink-data:
